<html lang="es">

    h1 { margin: 0 0 28px; font-weight: normal; font-size: 30px; color: var(--gold); letter-spacing: 0.02em; }
    a { color: var(--gold); }

</head>
<body>

    <img src="/favicon.svg" alt="">
